<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Stem -->
  <rect x="37" y="50" width="26" height="35" rx="8" fill="url(#stem)"/>
  <!-- Mushroom cap -->
  <ellipse cx="50" cy="48" rx="35" ry="28" fill="url(#cap)"/>
  <!-- Spots -->
  <circle cx="38" cy="38" r="6" fill="#fef3c7" opacity="0.8"/>
  <circle cx="58" cy="34" r="5" fill="#fef3c7" opacity="0.8"/>
  <circle cx="48" cy="28" r="4" fill="#fef3c7" opacity="0.8"/>
  <circle cx="30" cy="30" r="3" fill="#fef3c7" opacity="0.7"/>
  <!-- Sparkle ✨ -->
  <text x="72" y="30" font-size="22" fill="#f59e0b">✨</text>
</svg>
